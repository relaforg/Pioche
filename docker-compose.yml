services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: relaforg
      POSTGRES_PASSWORD: test
      POSTGRES_DB: pioche
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relaforg -d pioche"]
      interval: 2s
      retries: 10

  # Capture tous les emails envoyés en dev : http://localhost:8025
  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # interface web
      - "1025:1025" # SMTP, pour lancer l'app hors Docker

  app-dev:
    profiles: ["dev"]
    tty: true
    container_name: "dev"
    build: { context: ., target: dev }
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      LEPTOS_SITE_ADDR: 0.0.0.0:3000
      DATABASE_URL: postgres://relaforg:test@db:5432/pioche
      RUSTFLAGS: --cfg erase_components
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_TLS: none
      PUBLIC_URL: http://localhost:3000
    volumes:
      - .:/app
      - target-cache:/app/target
      - cargo-registry:/usr/local/cargo/registry

  app-prod:
    profiles: ["prod"]
    container_name: "prod"
    build: { context: ., target: prod }
    image: pioche:${VERSION}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      LEPTOS_SITE_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://relaforg:test@db:5432/pioche
      LEPTOS_ENV: PROD
      # Lu depuis .env ou l'environnement du shell, ex : https://pioche.fr
      PUBLIC_URL: ${PUBLIC_URL}
      # IP client lue dans X-Forwarded-For : seulement derrière un reverse proxy
      TRUST_PROXY: "true"

volumes:
  pgdata:
  target-cache:
  cargo-registry:

